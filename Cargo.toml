[workspace]
resolver = "2"
members = ["crates/ti-contracts", "crates/ti-core", "crates/ti-store", "crates/ti-sql", "crates/ti-ingest", "crates/ti-bench", "crates/ti-geo", "crates/ti-sync"]
default-members = ["."]

[features]
default = []
ti = ["dep:ti-contracts", "dep:ti-core", "dep:ti-store", "dep:ti-sql", "dep:ti-ingest", "dep:ti-geo", "dep:pgwire", "dep:tokio", "dep:futures", "dep:async-trait"]

[package]
name = "lume"
version = "0.12.0"
edition = "2021"
description = "Lume: A high-performance, zero-dependency, FST-backed tagger and on-demand BM25 hybrid search engine."
license = "BSD-3-Clause"

[dependencies]
tantivy-fst = "0.5"
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ti-contracts = { path = "crates/ti-contracts", optional = true }
ti-core = { path = "crates/ti-core", optional = true }
ti-sql = { path = "crates/ti-sql", optional = true }
ti-store = { path = "crates/ti-store", optional = true }
ti-ingest = { path = "crates/ti-ingest", optional = true }
ti-geo = { path = "crates/ti-geo", optional = true }

pgwire = { version = "=0.41.0", default-features = false, features = ["server-api"], optional = true }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "macros"], optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tokio-postgres = "0.7"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[[bin]]
name = "lume"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

# Debug builds keep only line tables for our code and no debug info for dependencies:
# full DataFusion debug info made each target/ tens of GB (2026-10-06).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
