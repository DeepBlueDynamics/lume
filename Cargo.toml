[workspace]
resolver = "2"
members = ["crates/ti-contracts", "crates/ti-core", "crates/ti-store", "crates/ti-sql", "crates/ti-ingest"]
default-members = ["."]

[features]
default = []
ti = ["dep:ti-contracts", "dep:ti-core", "dep:ti-store", "dep:ti-sql", "dep:ti-ingest"]

[package]
name = "lume"
version = "0.12.0"
edition = "2021"
description = "Lume: A high-performance, zero-dependency, FST-backed tagger and on-demand BM25 hybrid search engine."
license = "BSD-3-Clause"

[dependencies]
tantivy-fst = "0.5"
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ti-contracts = { path = "crates/ti-contracts", optional = true }
ti-core = { path = "crates/ti-core", optional = true }
ti-sql = { path = "crates/ti-sql", optional = true }
ti-store = { path = "crates/ti-store", optional = true }
ti-ingest = { path = "crates/ti-ingest", optional = true }

[[bin]]
name = "lume"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
