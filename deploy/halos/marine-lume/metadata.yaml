name: Lume TI
app_id: lume
version: 0.12.0-1
upstream_version: 0.12.0
description: Records your Signal K data and an offline library of manuals, and answers questions about both
long_description: |
  Lume TI keeps the boat's history and its manuals on the Pi. It records what
  the HaLOS Signal K server sees (navigation, engine, environment), builds an
  offline library from a catalog of about 470 free cruising references, and
  answers questions about both in SQL or plain English. It also serves the
  Signal K History API and an optional PostgreSQL endpoint for Grafana, with
  no separate database to run.
homepage: https://github.com/DeepBlueDynamics/lume
maintainer: DeepBlue Dynamics <kord@deepbluedynamics.com>
license: BSD-3-Clause
tags:
  - role::plugin
  - field::marine
  - interface::daemon
debian_section: net
architecture: arm64
depends:
  - marine-signalk-server-container
web_ui:
  enabled: true
  path: /admin/#/serverConfiguration/plugins/signalk-lume-ti
default_config:
  SIGNALK_URL: ws://127.0.0.1:3000
  SERVE_PORT: "5863"
  ENABLE_PG: "false"
  PG_PORT: "5864"
  PG_BIND: 127.0.0.1
  CHAT_OLLAMA_URL: https://ollama.com
  CHAT_MODEL: glm-5.3:cloud
