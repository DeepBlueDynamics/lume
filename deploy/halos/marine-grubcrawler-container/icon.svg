<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2333"/>
      <stop offset="100%" stop-color="#1b4965"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle Web / Compass Grid Lines in Background -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="64" y1="22" x2="64" y2="106" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="22" y1="64" x2="106" y2="64" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Crawler / Crab / Bug Glyph -->
  <!-- Left Legs -->
  <path d="M 44 48 Q 28 42 26 34" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 64 Q 22 64 20 60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 44 80 Q 28 86 26 94" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Legs -->
  <path d="M 84 48 Q 100 42 102 34" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 88 64 Q 106 64 108 60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 84 80 Q 100 86 102 94" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Body (Document / Capsule Core) -->
  <rect x="42" y="38" width="44" height="52" rx="14" fill="url(#glowGrad)"/>
  
  <!-- Document Lines inside Body -->
  <rect x="50" y="48" width="28" height="4" rx="2" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="50" y="56" width="22" height="4" rx="2" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="50" y="64" width="28" height="4" rx="2" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="64" cy="78" r="3" fill="#ffffff"/>
