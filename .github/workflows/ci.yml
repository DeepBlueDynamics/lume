name: CI

# Build and test on every push and pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or PR supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # Strict clippy runs once, in ti-lint; an informational pass here could
      # not fail and cost about 3 minutes per OS.
      - name: Test
        run: cargo test --locked

  ti-lint:
    name: TI fmt and strict clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ti-lint

      - name: Check TI crate formatting
        run: cargo fmt --check -p ti-contracts -p ti-core -p ti-store -p ti-ingest -p ti-sql -p ti-sync -p ti-bench -p ti-geo

      - name: Check root TI formatting
        run: rustfmt --check --edition 2021 src/ti_*.rs src/chat_sql.rs src/sql.rs src/document_extract.rs src/crawl_list.rs src/http_auth.rs src/nuts_auth.rs tests/ti_*.rs tests/chat_sql.rs tests/support/*.rs

      # One invocation shares the dependency graph between the TI crates and lume.
      - name: Strict clippy (TI crates and lume --features ti)
        run: cargo clippy --locked -p ti-contracts -p ti-core -p ti-store -p ti-ingest -p ti-sql -p ti-sync -p ti-bench -p ti-geo -p lume --features lume/ti --all-targets -- -D warnings

  ti:
    name: TI tests
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_TMPDIR: ${{ github.workspace }}/.test-tmp
      TMPDIR: ${{ github.workspace }}/.test-tmp
    steps:
      - uses: actions/checkout@v4

      - name: Create test scratch directory
        run: mkdir -p "$CARGO_TARGET_TMPDIR"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ti-strict

      # Also builds target/debug/lume (the integration tests' CARGO_BIN_EXE),
      # which the dashboard tests below reuse instead of a second build.
      - name: Test TI feature
        run: cargo test --locked --features ti

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test Signal K plugin
        working-directory: plugins/signalk-lume-ti
        run: npm test

      - name: Test benchmark scripts
        env:
          LUME_BIN: target/debug/lume
        run: |
          test -x "$LUME_BIN"
          python3 -m unittest discover -s bench -p 'test_*.py'
          python3 -m unittest discover -s bench/grafana -p 'test_*.py'

  deploy-test:
    name: Pi deployment script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck deployment scripts
        run: >-
          shellcheck scripts/deploy-pi.sh scripts/pi-retire-ollama.sh scripts/provision-pi.sh
          scripts/pi-bringup.sh scripts/pi-set-ollama-key.sh scripts/build-halos-debs.sh
          scripts/build-lume-container.sh deploy/halos/marine-lume-container/prestart.sh
          deploy/halos/marine-lume-container/image/lume-container-run
          deploy/halos/marine-lume-container/image/lume-container-health

      - name: Run deploy integration test
        run: bash scripts/test/deploy-pi.test.sh
