[package]
name = "ti-query-bench"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false
description = "Native text-and-telemetry query-class benchmark for Lume TI"

[dependencies]
serde_json = "1"
ti-sql = { path = "../ti-sql" }
lume = { path = "../..", features = ["ti"] }
ti-bench = { path = "../ti-bench" }
ti-contracts = { path = "../ti-contracts" }
ti-store = { path = "../ti-store" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
