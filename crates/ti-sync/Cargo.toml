[package]
name = "ti-sync"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Sync and replication engine for Lume Telemetry Index (manifest diff, resumable chunked shipping, shore import)"

[dependencies]
ti-contracts = { path = "../ti-contracts" }
ti-store = { path = "../ti-store" }
blake3 = { version = "1.5", features = ["pure"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
